<!doctype html>
<!--
  Motion design composition template. Every frame is a pure function of time: window.__render(t).
  No CSS animations, transition, setTimeout, Date.now() or Math.random() in the scenes,
  so render.mjs captures frames deterministically and in many browsers at once.

  Opened in a browser, it plays live: space = pause, ←/→ = ±1 s, click on the bar = seek.
  Parameters: ?t=2.5 (still), ?speed=0.75 (pace), ?name=Name, ?w=1080&h=1920 (format, only for a try-out: set W and H for good).

  The grey :root palette and the Urbanist font are demo placeholders, not a style. Replace them with the
  brand's colours and font, or with a decision from references/look.md (check_film.py warns while they're
  still here), then replace the scenes.
-->
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Otto</title>
    <style>
      /* BRAND FONT: Urbanist is only a demo placeholder. Replace the files and the family name with the brand's
         font or one chosen for the subject (references/look.md); the FAMILY variable in the script must match. */
      @font-face {
        font-family: "Urbanist";
        src: url(fonts/urbanist-latin.woff2) format("woff2");
        font-weight: 100 900;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Urbanist";
        src: url(fonts/urbanist-latin-ext.woff2) format("woff2");
        font-weight: 100 900;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      /* Kolory marki Otta: public/assets/style.css (docs/strona.md). */
      :root {
        --bg: #fbf7ec;
        --wash: #f6efdc;
        --ink: #151515;
        --ink-2: #5e594f;
        --line: #e7dfcb;
        --accent: #ffd21f;
        --accent-dark: #e6b800;
        --sun: #ffd21f;
        --paper: #ffffff;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0d0d0c; overflow: hidden; }
      body { display: grid; place-items: center; }
      #stage { position: relative; flex: none; overflow: hidden; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; transform-origin: 50% 50%; }
      .capture body { display: block; }
      .capture #stage { transform: none !important; }
      .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
      .abs { position: absolute; left: 0; top: 0; }
      .fill { position: absolute; inset: 0; }
      .o0 { transform-origin: 0 0; }
      .mask { position: absolute; overflow: hidden; }
      .word { position: absolute; left: 0; top: 0; white-space: pre; }
      svg { overflow: visible; }
      #grain { position: absolute; inset: -64px; pointer-events: none; opacity: 0.045; }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 120% at 50% 45%, transparent 55%, color-mix(in srgb, var(--ink) 14%, transparent) 100%); } /* the edges darken in the ink's hue, not in black */
      #hud { position: fixed; left: 0; right: 0; bottom: 0; height: 26px; cursor: pointer; background: rgb(255 255 255 / 0.06); }
      #hud i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
      #hud span { position: absolute; right: 10px; top: 4px; color: #bbb; font: 12px/1 ui-monospace, monospace; }
      .capture #hud { display: none; }

      /* Marka to płaski interfejs: bez ziarna i winiety (references/look.md). */
      #grain, #vignette { display: none; }

      /* Makieta Telegrama, jak na stronie (public/assets/style.css), w rozmiarze filmu */
      .tg-phone { background: var(--ink); border-radius: 64px; padding: 13px; box-shadow: 0 60px 110px -60px rgb(21 21 21 / .75), inset 0 0 0 2px #2b2b2b; }
      .tg-screen { display: grid; grid-template-rows: auto auto auto 1fr auto; grid-template-columns: minmax(0, 1fr); height: 840px; border-radius: 52px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; line-height: 1.3; color: #000; background: #f7f7f7; }
      .tg-status { display: flex; justify-content: space-between; align-items: center; padding: 18px 40px 6px 44px; font-weight: 600; font-size: 22px; }
      .tg-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 4px 18px 12px; border-bottom: 1px solid #d1d1d6; }
      .tg-back { color: #037ee5; font-size: 24px; }
      .tg-title { display: grid; justify-items: center; line-height: 1.15; }
      .tg-title b { font-size: 24px; font-weight: 600; }
      .tg-title small { font-size: 18px; color: #8e8e93; }
      .tg-avatar { justify-self: end; width: 54px; height: 54px; border-radius: 50%; }
      .tg-pinned { padding: 10px 20px; background: #fff; border-bottom: 1px solid #d1d1d6; }
      .tg-pinned span { display: block; padding-left: 12px; border-left: 3px solid #037ee5; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tg-pinned b { display: block; color: #037ee5; font-weight: 600; }
      .tg-chat { display: flex; flex-direction: column; justify-content: flex-end; gap: 9px; padding: 16px 14px; overflow: hidden;
        background: radial-gradient(at 15% 10%, #dbddbb 0, transparent 55%), radial-gradient(at 90% 20%, #d5d88d 0, transparent 50%), radial-gradient(at 10% 90%, #88b884 0, transparent 55%), radial-gradient(at 90% 85%, #6ba587 0, transparent 55%), #a9c69a; }
      .tg-date { align-self: center; margin: 6px 0; padding: 3px 14px; border-radius: 14px; background: rgb(28 64 40 / .32); color: #fff; font-size: 18px; font-weight: 600; }
      .tg-msg { position: relative; max-width: 84%; padding: 9px 15px 10px; border-radius: 22px; font-size: 22px; line-height: 1.3; box-shadow: 0 1px 1px rgb(0 0 0 / .12); }
      .tg-out { align-self: flex-end; background: #e1ffc7; border-bottom-right-radius: 7px; }
      .tg-in { align-self: flex-start; background: #fff; border-bottom-left-radius: 7px; }
      .tg-meta { float: right; margin: 8px 0 -6px 14px; font-size: 16px; color: #a1aab3; }
      .tg-out .tg-meta { color: #4fae4e; }
      .tg-line { display: block; margin-top: 8px; }
      .tg-quote { display: block; margin: 0 0 7px; padding: 5px 11px 6px; border-left: 4px solid #037ee5; border-radius: 6px; background: rgb(3 126 229 / .08); font-size: 19px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tg-quote b { display: block; color: #037ee5; font-weight: 600; }
      .tg-group { display: grid; gap: 6px; align-self: stretch; justify-items: start; }
      .tg-kb { display: grid; gap: 6px; width: 84%; }
      .tg-row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
      .tg-btn { display: block; text-align: center; padding: 11px 8px; border-radius: 12px; background: rgb(28 64 40 / .34); color: #fff; font-size: 19px; font-weight: 600; white-space: nowrap; }
      .tg-btn.is-pressed { background: rgb(28 64 40 / .7); }
      .tg-input { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; padding: 12px 16px 34px; background: #f7f7f7; border-top: 1px solid #d1d1d6; }
      .tg-menu { padding: 8px 16px; border-radius: 22px; background: #037ee5; color: #fff; font-size: 20px; font-weight: 600; }
      .tg-field { padding: 10px 18px; border-radius: 24px; background: #fff; border: 1px solid #d1d1d6; color: #8e8e93; font-size: 21px; }

      /* Lista przypięta w czacie */
      .listcard { background: var(--paper); border-radius: 40px; padding: 40px 48px 44px; box-shadow: 0 50px 90px -50px rgb(21 21 21 / .55); font-family: "Urbanist", sans-serif; }
      .listcard .pin { font-size: 30px; font-weight: 700; color: var(--ink-2); }
      .listcard .lt { margin-top: 10px; font-size: 54px; font-weight: 800; letter-spacing: -0.02em; }
      .listcard ol { margin: 26px 0 0; padding: 0; list-style: none; }
      .listcard li { font-size: 46px; font-weight: 600; line-height: 74px; transform-origin: 0 80%; }
      .listcard .n { display: inline-block; width: 64px; color: var(--ink-2); }
      .listcard .kbr { display: flex; gap: 12px; margin-top: 26px; }
      .listcard .kbr span { padding: 14px 26px; border-radius: 16px; background: rgb(21 21 21 / .08); font-size: 34px; font-weight: 800; }
      .listcard .kbr span.is-pressed { background: var(--sun); }

      /* Paragon: wszystko, co Otto zapisuje */
      .receipt { background: var(--paper); padding: 40px 48px 56px; border-radius: 24px 24px 0 0; font-family: "Urbanist", sans-serif; box-shadow: 0 40px 70px -46px rgb(21 21 21 / .45);
        -webkit-mask: radial-gradient(circle at 50% 100%, transparent 9px, #000 9.5px) 50% 100% / 22px 100% repeat-x; }
      .receipt .rh { display: grid; gap: 4px; padding-bottom: 22px; border-bottom: 3px dashed var(--line); }
      .receipt .rh b { font-size: 44px; font-weight: 800; letter-spacing: -0.01em; }
      .receipt .rh span { font-size: 26px; font-weight: 700; color: var(--ink-2); }
      .receipt dl { margin: 8px 0 0; }
      .receipt dl div { display: flex; justify-content: space-between; gap: 24px; padding: 16px 0; border-bottom: 2px dashed var(--line); font-size: 32px; }
      .receipt dt { color: var(--ink-2); font-weight: 600; }
      .receipt dd { margin: 0; font-weight: 800; text-align: right; }
      .receipt .rf { margin: 26px 0 0; font-size: 34px; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud"><i></i><span></span></div>

    <script>
      // ------------------------------------------------------------------
      // Parameters
      // ------------------------------------------------------------------
      const Q = new URLSearchParams(location.search);
      const CAPTURE = Q.has("capture");
      const FAMILY = "Urbanist"; // font marki (public/fonts, licencja OFL), ten sam co na stronie Otta
      const NAME = Q.get("name") || "Otto"; // NAME: a single parameter; a spelling fix is one change, not a rewrite of the scenes
      // FORMAT: set it here for good (e.g. 1080 × 1920 for a reel), so it cannot be forgotten at render time.
      // ?w=…&h=… overrides it only for a test.
      const W = Number(Q.get("w")) || 1920;
      const H = Number(Q.get("h")) || 1080;
      const CX = W / 2, CY = H / 2;
      // LENGTH: the scenes are laid out in "project time" up to TIMELINE (s). SPEED stretches the whole film evenly
      // (0.75 = 25% slower), so the film lasts TIMELINE / SPEED.
      const TIMELINE = 51.5; // sceny liczą swoje długości z fizyki (sekcja „Tempo”), plansza końcowa dostaje resztę
      // Subframes per frame for the render (motion blur). render.mjs reads it, so a re-render keeps the value the film was
      // checked with: raise it to 8–10 when the fastest passage steps (references/render.md).
      const SUB = 5;
      const SPEED = Number(Q.get("speed") || 1);
      const DURATION = TIMELINE / SPEED;
      if (CAPTURE) document.documentElement.classList.add("capture");
      const stage = document.getElementById("stage");
      stage.style.width = `${W}px`;
      stage.style.height = `${H}px`;
      stage.style.fontFamily = `"${FAMILY}", sans-serif`;
      const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

      // ------------------------------------------------------------------
      // Engine: interpolation, easings, spring
      // ------------------------------------------------------------------
      const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
      const lerp = (a, b, p) => a + (b - a) * p;
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const E = {
        lin: (x) => x,
        in2: (x) => x * x,
        out2: (x) => 1 - (1 - x) ** 2,
        io2: (x) => (x < 0.5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2),
        in3: (x) => x ** 3,
        out3: (x) => 1 - (1 - x) ** 3,
        io3: (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2),
        in4: (x) => x ** 4,
        out4: (x) => 1 - (1 - x) ** 4,
        io4: (x) => (x < 0.5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2),
        inExpo: (x) => (x <= 0 ? 0 : 2 ** (10 * x - 10)),
        outExpo: (x) => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
        ioExpo: (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? 2 ** (20 * x - 10) / 2 : (2 - 2 ** (-20 * x + 10)) / 2),
        outBack: (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2,
        inBack: (x) => 2.70158 * x ** 3 - 1.70158 * x * x,
      };
      // Damped spring: progress 0 → 1 with overshoot, s seconds after the start. f = frequency, z = damping.
      const spring = (s, f = 2, z = 0.42) => {
        if (s <= 0) return 0;
        const w = 2 * Math.PI * f;
        if (z >= 1) return 1 - Math.exp(-w * s) * (1 + w * s);
        const wd = w * Math.sqrt(1 - z * z);
        return 1 - Math.exp(-z * w * s) * (Math.cos(wd * s) + ((z * w) / wd) * Math.sin(wd * s));
      };
      const tw = (t, a, b, from, to, ease = E.out3) => lerp(from, to, ease(prog(t, a, b)));
      // Geometric zoom: interpolation on a log scale, so the eye sees an even pace.
      const zoom = (t, a, b, s0, s1, ease = E.io3) => Math.exp(lerp(Math.log(s0), Math.log(s1), ease(prog(t, a, b))));
      // Deterministic "randomness" instead of Math.random().
      const hash = (n) => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      // ------------------------------------------------------------------
      // DOM
      // ------------------------------------------------------------------
      const el = (tag, cls, parent, html) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html != null) e.innerHTML = html;
        if (parent) parent.appendChild(e);
        return e;
      };
      const svgEl = (tag, attrs, parent) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      };
      // Transform in one call: x, y, z, rx, ry, r (deg), s, sx, sy, o (opacity).
      const T = (e, o) => {
        let tr = o.z != null || o.rx || o.ry ? `translate3d(${o.x || 0}px,${o.y || 0}px,${o.z || 0}px)` : `translate(${o.x || 0}px,${o.y || 0}px)`;
        if (o.rx) tr += ` rotateX(${o.rx}deg)`;
        if (o.ry) tr += ` rotateY(${o.ry}deg)`;
        if (o.r) tr += ` rotate(${o.r}deg)`;
        const sx = (o.sx ?? 1) * (o.s ?? 1), sy = (o.sy ?? 1) * (o.s ?? 1);
        if (sx !== 1 || sy !== 1) tr += ` scale(${sx},${sy})`;
        e.style.transform = tr;
        if (o.o !== undefined) e.style.opacity = clamp(o.o);
      };
      // Weights by role. A static family has only the weights its @font-face blocks declare, and the browser fakes the rest:
      // set these to the declared ones. FONT() records what the scenes ask for, and __ready warns about anything undeclared.
      const WT = { numeral: 800, display: 800, text: 500, label: 700, heavy: 800 };
      const requested = new Set();
      const FONT = (weight, px, style = "") => (requested.add(`${weight} ${style || "normal"}`), `${style ? style + " " : ""}${weight} ${px}px "${FAMILY}"`);

      // ------------------------------------------------------------------
      // Typography
      // ------------------------------------------------------------------
      // Letter positions come from one unbroken string (a Range per character), so kerning is kept.
      function measure(text, font, ls = "0px") {
        const s = el("span", null, document.body);
        s.style.cssText = `position:absolute;left:0;top:0;white-space:pre;font:${font};letter-spacing:${ls};visibility:hidden`;
        s.textContent = text;
        const base = s.getBoundingClientRect();
        const r = document.createRange();
        const xs = [];
        for (let i = 0; i < text.length; i++) {
          r.setStart(s.firstChild, i);
          r.setEnd(s.firstChild, i + 1);
          const b = r.getBoundingClientRect();
          xs.push({ x: b.left - base.left, w: b.width });
        }
        s.remove();
        return { xs, w: base.width, h: base.height };
      }
      function letters(parent, text, font, ls = "0px", color = "") {
        const m = measure(text, font, ls);
        return [...text].map((ch, i) => {
          const s = el("span", "word", parent);
          s.textContent = ch;
          s.style.font = font;
          s.style.letterSpacing = ls;
          if (color) s.style.color = color;
          s.style.transformOrigin = "50% 70%";
          return { e: s, ch, x: m.xs[i].x, w: m.xs[i].w };
        });
      }
      // The dot over "i": the pixel difference between "i" and "ı" on a canvas. You write the word with "ı" (U+0131) and draw the dot yourself.
      // cx, cy: relative to the left and top edges of the letter's span in the DOM (the way letters() places them);
      // the canvas draws on the baseline, and a zero-height inline-block probe measures the span's baseline.
      // cx, dy: relative to the glyph's origin on the baseline, for drawing on a canvas.
      // Measuring from the "top" of the canvas put the dot about 0.13 em too high.
      function tittle(font, size) {
        const c = document.createElement("canvas");
        c.width = c.height = size * 2;
        const g = c.getContext("2d", { willReadFrequently: true });
        g.font = font;
        g.textBaseline = "alphabetic";
        const bx = size * 0.5, by = size * 1.4;
        const draw = (ch) => {
          g.clearRect(0, 0, c.width, c.height);
          g.fillText(ch, bx, by);
          return g.getImageData(0, 0, c.width, c.height).data;
        };
        const a = draw("i"), b = draw("ı");
        let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
        for (let y = 0; y < c.height; y++)
          for (let x = 0; x < c.width; x++) {
            const k = (y * c.width + x) * 4 + 3;
            if (a[k] > 128 && b[k] < 40) {
              x0 = Math.min(x0, x); x1 = Math.max(x1, x);
              y0 = Math.min(y0, y); y1 = Math.max(y1, y);
            }
          }
        if (x1 < 0) return null; // the font has no "ı" or no dot: keep a plain "i"
        const span = el("span", "word", document.body);
        span.style.cssText += `font:${font};visibility:hidden`;
        span.textContent = "ı";
        const probe = el("span", null, span);
        probe.style.cssText = "display:inline-block;width:0;height:0";
        const baseline = probe.getBoundingClientRect().top - span.getBoundingClientRect().top;
        span.remove();
        const dy = (y0 + y1 + 1) / 2 - by;
        return { cx: (x0 + x1 + 1) / 2 - bx, cy: baseline + dy, dy, r: (x1 - x0 + 1) / 2 };
      }
      // A row of words, each in its own mask. y is the top of the line box; the result's `base` is the baseline,
      // for aligning rows of different sizes. Per word: { text, w (weight), style ("italic"), color }.
      // The mask ends `belowEm` under the baseline. In Urbanist the ogonek of „ą”, „ę” goes 0.23 em down and descenders
      // 0.25 em; with the mask cut at 0.27 em, the word spent the slow end of its outExpo entry a few px too low and read
      // "pamieta" for ~14 frames before "pamięta". At 0.55 em the ogonek shows within ~4 frames of the word itself.
      // Above, `padEm` over the line box leaves room for accented capitals („Ś”, „Ż” reach 0.9 em over the baseline).
      function wordRow(parent, words, { x, y, size, weight = 400, style = "", ls = "-0.03em", align = "left", color = "", padEm = 0.12, belowEm = 0.55 }) {
        const items = words.map((w) => {
          const f = FONT(w.w || weight, size, w.style ?? style);
          return { ...w, f, mw: measure(w.text, f, ls).w, sp: measure("a a", f, ls).w - measure("aa", f, ls).w };
        });
        const total = items.reduce((a, it, i) => a + it.mw + (i < items.length - 1 ? it.sp : 0), 0);
        let cx = align === "center" ? x - total / 2 : x;
        const pad = size * padEm;
        const probe = el("span", null, document.body);
        probe.style.cssText = `position:absolute;left:0;top:0;font:${items[0].f};line-height:1.24;visibility:hidden`;
        probe.textContent = "x";
        const dot = el("span", null, probe);
        dot.style.cssText = "display:inline-block;width:0;height:0";
        const base = y + dot.getBoundingClientRect().top - probe.getBoundingClientRect().top;
        probe.remove();
        const top = y - pad, bottom = base + size * belowEm;
        return {
          size,
          total,
          base,
          // travel from below: the highest accent (0.9 em over the baseline) starts under the mask;
          // travel upwards: the lowest descender (0.25 em under it) ends over the mask
          travelIn: bottom - (base - size * 0.96),
          travelOut: Math.max(size * 1.86, base + size * 0.3 - top),
          items: items.map((it) => {
            const mask = el("div", "mask", parent);
            mask.style.cssText += `left:${cx - pad}px;top:${top}px;width:${it.mw + pad * 2}px;height:${bottom - top}px`;
            const s = el("span", "word", mask);
            s.textContent = it.text;
            s.style.cssText += `font:${it.f};letter-spacing:${ls};line-height:1.24;left:${pad}px;top:${pad}px;color:${it.color || color}`;
            const o = { mask, s, x: cx, w: it.mw };
            cx += it.mw + it.sp;
            return o;
          }),
        };
      }
      // Entry from below (outExpo) and exit upwards (in3), over distances measured from the mask (wordRow), so the word
      // starts and ends fully hidden. The exit travels at least 1.86 em, because otherwise a long rotated word catches
      // the mask with a corner and leaves a sliver of a letter on screen.
      // dir = 1: in from below, out upwards; dir = -1: in from above, out downwards (falling, sinking).
      function animRow(row, t, tin, tout, { st = 0.05, dur = 0.8, od = 0.36, rot = 5, dir = 1 } = {}) {
        const inD = dir > 0 ? row.travelIn : row.travelOut, outD = dir > 0 ? row.travelOut : row.travelIn;
        row.items.forEach((w, i) => {
          const p = E.outExpo(prog(t, tin + i * st, tin + i * st + dur));
          const q = tout == null ? 0 : E.in3(prog(t, tout + i * st * 0.5, tout + i * st * 0.5 + od));
          T(w.s, { y: dir * ((1 - p) * inD - q * outD), r: dir * ((1 - p) * rot - q * rot * 0.6) });
        });
      }

      // ------------------------------------------------------------------
      // Transitions
      // ------------------------------------------------------------------
      // Directional blur for whip pans (subframes are not enough at 100+ px per frame).
      const fx = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      fx.setAttribute("width", "0");
      fx.setAttribute("height", "0");
      fx.style.position = "absolute";
      fx.innerHTML = `<filter id="mbx" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbxG" stdDeviation="0 0"/></filter>`;
      document.body.appendChild(fx);
      const mbG = fx.querySelector("#mbxG");
      const whipBlur = (e, vx, vy) => {
        if (Math.abs(vx) < 1.5 && Math.abs(vy) < 1.5) return void (e.style.filter = "");
        mbG.setAttribute("stdDeviation", `${Math.min(48, Math.abs(vx))} ${Math.min(48, Math.abs(vy))}`);
        e.style.filter = "url(#mbx)";
      };
      // Velocity of a position function: shift in px per frame at 60 fps.
      // For directional blur, use a factor of about 0.15 (whipBlur caps at 48 px).
      const vel = (f, t) => f(t + 1 / 120) - f(t - 1 / 120);
      // Camera: world point F lands on screen point C, at scale s.
      const camera = (e, { cx = CX, cy = CY, fx = CX, fy = CY, s = 1 }) =>
        (e.style.transform = `translate(${cx}px,${cy}px) scale(${s}) translate(${-fx}px,${-fy}px)`);
      // Iris: a circle in `color` around (cx, cy), radius from r0 to r1 at progress p.
      // A circle from the first frame, because a rectangle turning into a circle looks cheap. The default r1 reaches
      // the farthest corner, so the circle covers the frame even when it grows from off centre.
      // `feather` (px) softens the edge: with fast growth (over ~60 px per frame), 5 motion blur subframes
      // show steps; in that case pass feather ≈ 0.6 · |vel| of the radius.
      const farthest = (cx, cy) => Math.max(Math.hypot(cx, cy), Math.hypot(W - cx, cy), Math.hypot(cx, H - cy), Math.hypot(W - cx, H - cy));
      const iris = (e, p, { cx = CX, cy = CY, r0 = 0, r1 = farthest(cx, cy) * 1.02, color = "var(--accent)", feather = 1 } = {}) => {
        const r = lerp(r0, r1, p);
        e.style.cssText = `position:absolute;inset:0;pointer-events:none;display:${r > 0.5 ? "block" : "none"};` +
          `background:radial-gradient(circle ${r + feather / 2}px at ${cx}px ${cy}px, ${color} ${Math.max(0, r - feather / 2)}px, transparent ${r + feather / 2}px)`;
      };

      // ------------------------------------------------------------------
      // Content blocks
      // ------------------------------------------------------------------
      const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

      const typewriter = (text, t, a, b, caret = "currentColor") => {
        const n = Math.round(text.length * prog(t, a, b));
        const on = t > a - 0.3 && t < b + 0.8 && (t < b || Math.floor(t * 3) % 2 === 0);
        return esc(text.slice(0, n)) + (on ? `<i style="display:inline-block;width:.07em;height:1em;margin-left:.05em;vertical-align:-.14em;background:${caret}"></i>` : "");
      };
      // Counter from 0 to n that eases to a stop. Fixed-width digits: font-variant-numeric: tabular-nums.
      const counter = (n, t, a, b, ease = E.outExpo) => Math.round(n * ease(prog(t, a, b)));
      // Spring pop from the moment `at`: 0 → 1 with overshoot. For small objects, not for blocks of text.
      const pop = (t, at, f = 2.6, z = 0.4) => (t < at ? 0 : spring(t - at, f, z));

      // ------------------------------------------------------------------
      // Creative moves (when to use them: references/concept.md, section 4)
      // ------------------------------------------------------------------
      const svgDefs = svgEl("svg", { width: 0, height: 0, style: "position:absolute" }, document.body);
      // A point in the middle of a letter stroke, nearest to (x, y): a zoom around it fills the frame with the letter
      // instead of falling into the gap between letters.
      function inkPoint(text, font, x, y, ls = "-0.02em") {
        const c = document.createElement("canvas");
        c.width = W;
        c.height = H;
        const g = c.getContext("2d", { willReadFrequently: true });
        g.font = font;
        g.letterSpacing = ls;
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillText(text, x, y);
        const px = g.getImageData(0, 0, W, H).data;
        const ink = (i, j) => i >= 0 && j >= 0 && i < W && j < H && px[(j * W + i) * 4 + 3] > 128;
        let best = null;
        for (let r = 0; r < Math.max(W, H) && !best; r += 2)
          for (let k = 0; k < 32 && !best; k++) {
            const i = Math.round(x + r * Math.cos((k / 32) * 2 * Math.PI)), j = Math.round(y + r * Math.sin((k / 32) * 2 * Math.PI));
            if (ink(i, j)) best = [i, j];
          }
        if (!best) return { x, y, r: 0 };
        let [i, j] = best, l = i, rr = i, u = j, d = j; // middle of the stroke, horizontally and vertically
        while (ink(l - 1, j)) l--;
        while (ink(rr + 1, j)) rr++;

        while (ink(Math.round(i), u - 1)) u--;
        while (ink(Math.round(i), d + 1)) d++;

        const hr = (rr - l + 1) / 2, vr = (d - u + 1) / 2;

      }
      // Letters as windows: the element (usually the next scene) shows only through the letters of the text.
      // update(enter 0..1, zoom 0..1): at zoom = 1 the window covers the whole frame and the clipping goes away.
      // text-rendering: geometricPrecision, because Chrome caps text at 10,000 px on screen: without it
      // the letters jump during a big zoom instead of growing smoothly.
      let clipIds = 0;
      function letterWindow(target, text, { size, weight = 800, x = CX, y = CY, ls = "-0.02em", maxScale = 60 }) {
        const id = `window-${++clipIds}`; // one clipPath per window, also for two words of the same length
        const clip = svgEl("clipPath", { id, clipPathUnits: "userSpaceOnUse" }, svgDefs);
        const tx = svgEl("text", { x, y, "text-anchor": "middle", "dominant-baseline": "central", "font-family": FAMILY, "font-weight": weight, "font-size": size, "letter-spacing": ls, "text-rendering": "geometricPrecision" }, clip);
        tx.textContent = text;
        const pv = inkPoint(text, FONT(weight, size), x, y, ls);
        // zoom far enough for the stroke to cover the frame before the clipping goes away, thin strokes too
        const top = Math.max(maxScale, pv.r ? (1.2 * farthest(pv.x, pv.y)) / pv.r : 0);
        return (enter, z) => {
          const s = lerp(0.82, 1, E.outExpo(enter)) * Math.exp(Math.log(top) * E.in3(z)); // geometric zoom
          tx.setAttribute("transform", `translate(${pv.x} ${pv.y}) scale(${s}) translate(${-pv.x} ${-pv.y})`);
          target.style.clipPath = z >= 1 ? "none" : enter <= 0 ? "inset(50%)" : `url(#${id})`;

      }
      // Transition in the shape of the mark: shapes pop up in place and grow until they cover the frame.
      // shapes: [{ x, y, size, radius }] in px; radius as a fraction of the side (0.19 ≈ the mark's corner rounding).
      function shapeWipe(parent, shapes, color) {
        const items = shapes.map((sh) => {
          // the side at which the shape covers all four corners of the frame, found by bisection: exact for any corner radius
          const rr = Math.min(sh.radius ?? 0.19, 0.5);
          const inside = (side, dx, dy) => {
            const h = side / 2, rc = rr * side, ex = Math.max(dx - (h - rc), 0), ey = Math.max(dy - (h - rc), 0);
            return dx <= h && dy <= h && ex * ex + ey * ey <= rc * rc;
          };
          const corners = [[sh.x, sh.y], [W - sh.x, sh.y], [sh.x, H - sh.y], [W - sh.x, H - sh.y]];
          let lo = 0, hi = 4 * Math.hypot(W, H);

            const mid = (lo + hi) / 2;
            if (corners.every(([dx, dy]) => inside(mid, dx, dy))) hi = mid;
            else lo = mid;
          }
          const cover = hi * 1.01;
          const e = el("div", "abs", parent);
          e.style.cssText += `width:${cover}px;height:${cover}px;left:${sh.x - cover / 2}px;top:${sh.y - cover / 2}px;border-radius:${cover * rr}px;background:${color}`;
          return { e, s0: sh.size / cover };
        });
        return (t, at) =>
          items.forEach(({ e, s0 }, k) => {
            const a = at + k * 0.08;
            const grow = E.io4(prog(t, a + 0.18, a + 0.62));
            T(e, { s: t < a ? 0 : s0 * clamp(spring(t - a, 2.6, 0.45), 0, 1.3) * (1 - grow) + grow, o: t < a ? 0 : 1 });

      }
      // Shape morphing: radius as a function of angle, mixed linearly between two shapes.
      // Works for shapes that are "star-shaped" around the centre (circle, star, rounded square).
      const SHAPE = {
        circle: () => () => 1,
        star: (points = 5, inner = 0.46) => {
          const step = Math.PI / points;
          return (a) => {
            const rel = (((a + Math.PI / 2) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
            const k = Math.floor(rel / step);
            const t0 = -Math.PI / 2 + k * step, t1 = t0 + step;
            const r0 = k % 2 ? inner : 1, r1 = k % 2 ? 1 : inner;
            const p1 = [r0 * Math.cos(t0), r0 * Math.sin(t0)], p2 = [r1 * Math.cos(t1), r1 * Math.sin(t1)];
            const e = [p2[0] - p1[0], p2[1] - p1[1]], dir = [Math.cos(a), Math.sin(a)];

          };
        },
        squircle: (n = 5, k = 0.84) => (a) => k * Math.pow(Math.pow(Math.abs(Math.cos(a)), n) + Math.pow(Math.abs(Math.sin(a)), n), -1 / n),
      };
      const morphPath = (cx, cy, R, fa, fb, p, rot = 0, N = 240) => {
        let d = "";
        for (let i = 0; i < N; i++) {
          const a = (i / N) * 2 * Math.PI - Math.PI / 2;
          const r = R * lerp(fa(a - rot), fb(a - rot), p);

        }

      };

      // ------------------------------------------------------------------
      // Scenes. scene(name, from, to, build): build creates the DOM and returns update(t).
      // After cutting a passage, set `shift` before the following scenes instead of rewriting their times.
      // cue(t, kind) collects moments for syncing sound (render.mjs writes out/cues.json).
      // ------------------------------------------------------------------
      const scenes = [];
      const defs = [];
      const CUES = [];
      let shift = 0;
      let building = 0;
      const scene = (name, t0, t1, build) => defs.push({ name, t0: t0 - shift, t1: t1 - shift, shift, build });
      const cue = (t, kind, opt = {}) => CUES.push({ t: +(t - building).toFixed(4), kind, ...opt });

      // ==================================================================
      // OTTO: „Rzut i powrót”. Czasownik: odbija. Rzucasz Ottowi myśl, a on odbija ją we właściwej chwili.
      // Fizyka liczona wzorami (parabole i odbicia), więc każda klatka jest czystą funkcją czasu.
      // ==================================================================
      const FLOOR = 830; // podłoga w kadrze
      const G = 2600; // grawitacja, px/s²
      const OS = 260; // rozmiar Otta w większości scen

      // Lot z wysokości h0 (px nad podłogą) z prędkością pionową v0 (w górę +) od chwili t0, z odbiciami.
      // Zwraca wysokość, czas od ostatniego uderzenia i prędkość uderzenia (do spłaszczenia).
      function ballistic(t, t0, h0, v0, { e = 0.42, minV = 220 } = {}) {
        let tt = t - t0;
        if (tt <= 0) return { h: h0, since: 9, iv: 0, v: v0 };
        let v = v0, h = h0, since = 9, iv = 0;
        for (let k = 0; k < 14; k++) {
          const hit = (v + Math.sqrt(v * v + 2 * G * h)) / G;
          if (tt < hit) return { h: h + v * tt - (G * tt * tt) / 2, since, iv, v: v - G * tt };
          tt -= hit;
          iv = Math.sqrt(v * v + 2 * G * h);
          since = tt;
          v = iv * e;
          h = 0;
          if (v < minV) return { h: 0, since, iv, v: 0 };
        }
        return { h: 0, since, iv, v: 0 };
      }
      // Spłaszczenie po uderzeniu: gasnące drganie, mocniejsze przy szybszym uderzeniu.
      const squashAfter = (since, iv) => (since > 1.5 ? 0 : Math.min(0.26, iv / 5200) * Math.exp(-since * 8.5) * Math.cos(since * 30));
      // Rozciągnięcie w locie (proporcjonalne do prędkości pionowej).
      const stretch = (v) => -Math.min(0.12, Math.abs(v) / 11000);
      // Mrugnięcie w podanych chwilach.
      const blinkAt = (t, times) => times.reduce((m, b) => Math.max(m, 1 - Math.abs(t - b) / 0.085), 0);
      // Parabola między dwoma punktami, z wierzchołkiem `arc` px nad prostą.
      const arcPos = (p, x0, y0, x1, y1, arc) => ({ x: lerp(x0, x1, p), y: lerp(y0, y1, p) - 4 * arc * p * (1 - p) });

      const MOODS = {
        neutral: [[38, 41, 16, 38, 8], [66, 41, 16, 38, 8]],
        happy: [[37, 53, 18, 16, 9], [65, 53, 18, 16, 9]],
        look: [[46, 43, 15, 34, 7.5], [72, 43, 15, 34, 7.5]],
        wink: [[38, 41, 16, 38, 8], [65, 57, 18, 7, 3.5]],
        wow: [[34, 35, 24, 48, 12], [62, 35, 24, 48, 12]],
        think: [[40, 33, 15, 26, 7.5], [68, 31, 15, 26, 7.5]],
      };
      const SHUT = [[38, 57, 16, 6, 3], [66, 57, 16, 6, 3]];
      let ottoIds = 0;
      // Otto: (x, y) to punkt styku z podłogą. Zwraca funkcję ustawiającą stan klatki.
      function makeOtto(parent, size) {
        const id = `otto${++ottoIds}`;
        const shadow = el("div", "abs", parent);
        shadow.style.cssText += `width:${size * 0.62}px;height:${size * 0.075}px;border-radius:50%;background:var(--ink)`;
        const root = el("div", "abs", parent);
        root.style.cssText += `width:${size}px;height:${size}px;transform-origin:50% 92.5%`;
        root.innerHTML = `<svg viewBox="0 0 120 120" width="${size}" height="${size}"><defs><radialGradient id="${id}h" cx="34%" cy="24%" r="88%"><stop offset="0%" stop-color="#33383e"/><stop offset="55%" stop-color="#15171a"/><stop offset="100%" stop-color="#090a0c"/></radialGradient><radialGradient id="${id}s" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff" stop-opacity=".22"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><circle cx="60" cy="60" r="51" fill="url(#${id}h)"/><ellipse cx="44" cy="30" rx="18" ry="11" fill="url(#${id}s)"/><g class="face"><rect fill="#fff"/><rect fill="#fff"/></g></svg>`;
        const face = root.querySelector(".face");
        const eyes = [...root.querySelectorAll("rect")];
        const set = (o) => {
          const A = MOODS[o.mood || "neutral"], B = MOODS[o.mood2 || o.mood || "neutral"], p = o.mp ?? 0, bl = clamp(o.blink ?? 0);
          eyes.forEach((r, i) => {
            const e = A[i].map((v, k) => lerp(lerp(v, B[i][k], p), SHUT[i][k], bl));
            const talk = o.talk ? 1 - 0.22 * Math.abs(Math.sin(o.talk * 17)) : 1;
            const hh = e[3] * talk;
            r.setAttribute("x", (e[0] + (o.gx || 0)).toFixed(2));
            r.setAttribute("y", (e[1] + (o.gy || 0) + (e[3] - hh) / 2).toFixed(2));
            r.setAttribute("width", e[2].toFixed(2));
            r.setAttribute("height", hh.toFixed(2));
            r.setAttribute("rx", Math.min(e[4], hh / 2).toFixed(2));
          });
          face.style.opacity = o.eyes ?? 1;
          face.setAttribute("transform", `rotate(${(o.roll || 0).toFixed(2)} 60 60)`);
          const sq = o.sq || 0, s = o.s ?? 1, h = o.h || 0;
          T(root, { x: o.x - size / 2, y: o.y - size * 0.925 - h, s, sx: 1 + sq * 0.8, sy: 1 - sq, r: o.r || 0, o: o.o ?? 1 });

          shadow.style.opacity = (0.13 * (1 - lift * 0.7) * (o.o ?? 1) * (o.shadow ?? 1)).toFixed(3);
        };

        set.eyeRects = (x, y, mood = "neutral") =>
          MOODS[mood].map(([ex, ey, ew, eh, er]) => {
            const k = size / 120;
            return { x: x - size / 2 + ex * k, y: y - size * 0.925 + ey * k, w: ew * k, h: eh * k, r: er * k };
          });
        return set;
      }

      // Dymek wiadomości (jak na stronie: żółty od człowieka)
      function bubble(parent, text, { size = 40, bg = "var(--sun)", color = "var(--ink)", radius = "28px 28px 8px 28px" } = {}) {
        const b = el("div", "abs", parent);
        b.style.cssText += `padding:${size * 0.5}px ${size * 0.7}px;border-radius:${radius};background:${bg};color:${color};font:${FONT(WT.label, size)};white-space:nowrap;box-shadow:0 30px 60px -36px rgb(21 21 21 / .5)`;
        b.textContent = text;
        return b;
      }

      // Kursor dotyku: kółko, które „klika”

        const d = el("div", "abs", parent);
        d.style.cssText += "width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgb(21 21 21 / .22);border:4px solid var(--ink)";
        return (x, y, o, press = 0) => T(d, { x, y, s: 1 - press * 0.25, o });
      }

      // Podpis sceny: jedna albo kilka linii, każde słowo w masce. Wejście z dołu, wyjście w górę.
      function caption(root, lines, { x = 140, y = 150, size = 92, color = "var(--ink)", weight = WT.display } = {}) {
        return (Array.isArray(lines) ? lines : [lines]).map((ln, i) =>
          wordRow(root, ln.split(" ").map((w) => ({ text: w })), { x, y: y + i * size * 1.12, size, weight, color }),
        );
      }
      const animCap = (rows, t, tin, tout) => rows.forEach((r, i) => animRow(r, t, tin + i * 0.14, tout == null ? null : tout + i * 0.05, { st: 0.06 }));
      // Środek elementu w układzie kadru, zmierzony przy budowie sceny (przed jakimkolwiek przesunięciem).
      const centerOf = (e) => {

      };

      // ------------------------------------------------------------------
      // Tempo. Każda scena liczy czas lokalny u (0 = jej początek), a jej długość wynika z fizyki: cięcie wypada,
      // gdy Otto ląduje (start skoku J + czas lotu 2·v0/G). Zmiana w jednej scenie przesuwa wszystkie kolejne.
      // Zasady: każdy tekst stoi co najmniej słowa × 0,3 s + 1 s, a nowy podpis wchodzi dopiero, gdy poprzedni wyszedł
      // (dwa podpisy w jednym miejscu naraz dawały ucięte litery, np. „Komenay”).
      // ------------------------------------------------------------------
      const flight = (v0) => (2 * v0) / G;

      // ------------------------------------------------------------------
      // 1. Rzut: Otto spada w pusty kadr, łapie rzuconą myśl i podskakuje w lewo.
      // ------------------------------------------------------------------
      const S1 = 0, J1 = 2.34, D1 = J1 + flight(970);
      scene("rzut", S1, S1 + D1, (root) => {
        root.style.background = "var(--bg)";
        const otto = makeOtto(root, 300);
        const msg = bubble(root, "jutro o 9 przypomnij mi o fakturze", { size: 44 });
        const mw = msg.offsetWidth, mh = msg.offsetHeight;
        cue(S1 + 0.41, "impact"); cue(S1 + 1.95, "pop"); cue(S1 + D1, "impact");
        return (t) => {
          const u = t - S1;
          const d = ballistic(u, -0.32, 700, 0, { e: 0.38, minV: 260 });
          let x = CX, h = d.h, sq = squashAfter(d.since, d.iv) + stretch(d.v);

          // przysiad i skok w lewo, lądowanie dokładnie na cięciu
          sq += 0.12 * Math.sin(Math.PI * prog(u, J1 - 0.17, J1));
          if (u > J1) {
            const j = ballistic(u, J1, 0, 970, { e: 0.001, minV: 1e9 });
            x = lerp(CX, 480, prog(u, J1, D1));
            h = j.h;
            sq = stretch(j.v);
          }
          const look = prog(u, 1.0, 1.3) * (1 - prog(u, 1.85, 1.95));
          const mood = u < 0.42 ? "wow" : u < 1.65 ? "neutral" : u < 1.99 ? "wow" : "happy";
          otto({ x, y: FLOOR, h, sq, mood, gx: -5 * look, gy: -2 * look, blink: blinkAt(u, [1.1]) });
          // myśl leci po łuku (dość wolno, żeby dało się ją przeczytać) i znika w Ottcie
          const p = prog(u, 0.95, 1.95);
          const a = arcPos(E.lin(p), -mw - 40, 330, CX - mw / 2, FLOOR - 190 - mh / 2, 210);
          const absorb = E.in3(prog(u, 1.82, 1.97));
          T(msg, { x: a.x + (mw / 2) * absorb * 0.8, y: a.y, r: lerp(-14, 4, p) + Math.sin(p * 6) * 3, s: 1 - absorb * 0.85, o: u < 0.95 ? 0 : 1 - absorb });
        };
      });

      // ------------------------------------------------------------------
      // 2. Tytuł: litery „Otto” spadają na podłogę obok niego, pod spodem zdanie.
      // ------------------------------------------------------------------
      const S2 = S1 + D1, J2 = 3.985, D2 = J2 + flight(800);
      scene("tytul", S2, S2 + D2, (root) => {
        root.style.background = "var(--bg)";
        const otto = makeOtto(root, 300);
        const FS = 270;
        const font = FONT(WT.display, FS);
        const word = el("div", "abs", root);
        const ls = letters(word, "Otto", font, "-0.04em");
        const x0 = 720;
        const sub = caption(root, "pamięta za Ciebie.", { x: x0 + 6, y: FLOOR + 24, size: 96 });
        const line = wordRow(root, "Osobisty asystent w Telegramie".split(" ").map((w) => ({ text: w })), { x: x0 + 12, y: FLOOR - FS * 0.94 - 40, size: 46, weight: WT.label, color: "var(--ink-2)" });
        cue(S2, "impact"); cue(S2 + 0.28, "drop");
        return (t) => {
          const u = t - S2;
          const land = squashAfter(u, 970);
          // na koniec podskok w miejscu, lądowanie na cięciu
          const hop = ballistic(u, J2, 0, 800, { e: 0.001, minV: 1e9 });
          const pre = 0.1 * Math.sin(Math.PI * prog(u, J2 - 0.12, J2));
          otto({ x: 480, y: FLOOR, h: hop.h, sq: land + pre + (u > J2 ? stretch(hop.v) : 0), mood: u < 1.1 ? "look" : u < J2 - 0.4 ? "happy" : "wow", gx: u < 1.1 ? 4 : 0, blink: blinkAt(u, [1.85, 3.1]) });
          ls.forEach((L, i) => {
            const b = ballistic(u, 0.08 + i * 0.09, 760, 0, { e: 0.3, minV: 300 });
            const s = squashAfter(b.since, b.iv) + stretch(b.v);
            const fall = E.in2(prog(u, J2 - 0.2 + i * 0.04, J2 + 0.5 + i * 0.04)) * 900;
            T(L.e, { x: x0 + L.x, y: FLOOR - FS * 0.94 - b.h + fall, sx: 1 + s * 0.8, sy: 1 - s, o: u < 0.08 + i * 0.09 ? 0 : 1 });
            L.e.style.transformOrigin = "50% 86%";
          });
          animCap(sub, u, 0.85, J2 - 0.3);
          animRow(line, u, 1.15, J2 - 0.35, { st: 0.05, rot: 3 });
        };
      });

      // ------------------------------------------------------------------
      // 3. Czat: prawdziwa scena z Telegrama, na jednym przykładzie.
      // ------------------------------------------------------------------
      const S3 = S2 + D2, J3 = 7.785, D3 = J3 + flight(930);
      scene("czat", S3, S3 + D3, (root) => {
        root.style.background = "var(--bg)";
        // Noc między wieczorem a rankiem: słońce zachodzi i wschodzi, scena przygasa.
        const sun = el("div", "abs", root);
        sun.style.cssText += "width:300px;height:300px;border-radius:50%;background:var(--sun)";
        const night = el("div", "fill", root);
        night.style.background = "var(--ink)";
        const otto = makeOtto(root, 300);
        const clockLbl = el("div", "abs", root);
        clockLbl.style.cssText += `font:${FONT(WT.label, 46)};color:var(--ink-2)`;
        const clock = el("div", "abs", root);
        clock.style.cssText += `font:${FONT(WT.display, 190)};letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:var(--ink)`;
        const cap1 = caption(root, ["Piszesz jak", "do znajomego."], { y: 150, size: 96 });
        const cap2 = caption(root, ["Otto przypomina", "o czasie."], { y: 150, size: 96 });
        // telefon z czatem
        const phone = el("div", "abs tg-phone", root);
        phone.style.cssText += "left:1100px;top:70px;width:560px";
        phone.innerHTML = `<div class="tg-screen">
          <div class="tg-status"><span>18:24</span><span>●●●</span></div>
          <div class="tg-head"><span class="tg-back">‹ Czaty</span><span class="tg-title"><b>Otto</b><small class="typing">bot</small></span><img class="tg-avatar" src="img/otto-avatar.png"></div>
          <div class="tg-pinned"><span><b>Przypięta wiadomość</b>📋 Twoja lista: 1. kupić mleko 2. odebrać paczkę</span></div>
          <div class="tg-chat">
            <p class="tg-date s1">Dziś</p>
            <div class="tg-msg tg-out s2">jutro o 9 przypomnij mi o fakturze<span class="tg-meta">18:24 ✓✓</span></div>
            <div class="tg-msg tg-in s3"><span class="tg-text">Jasne, przypomnę Ci jutro rano o fakturze.</span><span class="tg-text tg-line">⏰ Przypomnę jutro o 9:00.</span><span class="tg-meta">18:24</span></div>
            <p class="tg-date s4">Jutro</p>
            <div class="tg-group s5"><div class="tg-msg tg-in r1"><span class="tg-quote"><b>Ty</b>jutro o 9 przypomnij mi o fakturze</span><span class="tg-text r1t">⏰ Przypominam o tym ↑</span><span class="tg-meta">9:00</span></div>
              <div class="tg-kb"><span class="tg-row"><span class="tg-btn">+15 min</span><span class="tg-btn">+1 h</span><span class="tg-btn">Jutro 9:00</span></span><span class="tg-btn done">✓ Zrobione</span></div></div>
          </div>
          <div class="tg-input"><span class="tg-menu">☰ Menu</span><span class="tg-field">Wiadomość</span></div>
        </div>`;
        const note = el("div", "abs", root);
        note.style.cssText += `left:1100px;top:1010px;width:560px;text-align:center;font:${FONT(WT.label, 26)};color:var(--ink-2)`;
        note.textContent = "Przykładowa rozmowa";
        const q = (c) => phone.querySelector(c);
        const steps = [q(".s1"), q(".s2"), q(".s3"), q(".s4"), q(".s5")];
        const typing = q(".typing");
        const statusTime = q(".tg-status span");
        const doneBtn = q(".done"), kb = q(".tg-kb"), r1t = q(".r1t");
        const fly = bubble(root, "jutro o 9 przypomnij mi o fakturze", { size: 30 });
        const tap = centerOf(doneBtn);
        tap.x += 110; // obok napisu, żeby kursor nie zasłaniał „Zrobione”
        const touch = makeTouch(root);
        const at = [0.63, 0.93, 1.93, 4.15, 4.55];
        cue(S3, "impact"); cue(S3 + 0.93, "pop"); cue(S3 + 1.93, "pop"); cue(S3 + 4.55, "alarm"); cue(S3 + 6.5, "tap");
        return (t) => {
          const u = t - S3;
          // telefon wjeżdża od dołu na sprężynie, a na koniec spada
          const up = 1 - clamp(spring(u - 0.08, 1.2, 0.7), 0, 1.1);
          const drop = E.in2(prog(u, J3 - 0.08, J3 + 0.7)) * 1150;
          T(phone, { y: up * 640 + drop, r: drop * 0.006 });
          T(note, { y: up * 640 + drop, o: prog(u, 0.98, 1.38) });
          steps.forEach((s, i) => {
            const p = pop(u, at[i], 2.4, 0.5);
            T(s, { y: (1 - clamp(p)) * 18, s: 0.94 + 0.06 * clamp(p, 0, 1.06), o: u < at[i] ? 0 : clamp(p * 2) });
          });
          typing.textContent = u > 1.13 && u < 1.93 ? "pisze…" : "bot";
          statusTime.textContent = u < 4.0 ? "18:24" : "9:00";
          // klik w „Zrobione”: przyciski znikają, wiadomość zmienia się w „✓ Zrobione” (tak robi bot);
          // przyciski stoją ponad 2 s, a wynik kliknięcia około sekundy, zanim telefon spadnie
          const tIn = prog(u, 5.85, 6.35);
          // kursor znika zaraz po kliknięciu: po edycji wiadomości czat się przesuwa i kółko wisiałoby nad tekstem
          touch(lerp(1700, tap.x, E.out3(tIn)), lerp(1080, tap.y, E.out3(tIn)), prog(u, 5.85, 5.95) * (1 - prog(u, 6.68, 6.8)), Math.sin(Math.PI * prog(u, 6.4, 6.6)));
          doneBtn.classList.toggle("is-pressed", u > 6.45 && u < 6.7);
          const edited = u > 6.7;
          kb.style.display = edited ? "none" : "grid";
          r1t.textContent = edited ? "✓ Zrobione" : "⏰ Przypominam o tym ↑";
          // myśl z Otta leci do telefonu i staje się wiadomością
          const fp = prog(u, 0.38, 0.93);
          const fa = arcPos(E.io2(fp), 480 - 120, FLOOR - 200, 1290, 330, 180);
          T(fly, { x: fa.x, y: fa.y, s: 1 - fp * 0.3, o: fp > 0 && fp < 1 ? 1 : 0, r: lerp(-6, 0, fp) });
          // noc: słońce zachodzi i wschodzi, Otto przysypia
          const set = E.io3(prog(u, 2.95, 3.6)), rise = E.io3(prog(u, 3.75, 4.4));
          const sunY = 210 + set * 760 - rise * 760;
          T(sun, { x: 120, y: sunY, o: u > 2.8 && u < 4.7 ? 1 : 0 });
          night.style.opacity = (0.32 * (E.io2(prog(u, 3.25, 3.55)) - E.io2(prog(u, 3.8, 4.15)))).toFixed(3);
          clockLbl.textContent = u < 3.7 ? "Dziś" : "Jutro";
          clock.textContent = u < 3.7 ? "18:24" : "9:00";
          const ck = prog(u, 3.0, 3.3) - prog(u, 4.4, 4.7);
          T(clockLbl, { x: 150, y: 240, o: ck });
          T(clock, { x: 140, y: 290, o: ck });
          animCap(cap1, u, 0.38, 2.85);
          animCap(cap2, u, 4.6, 7.25);
          // Otto: ląduje z poprzedniej sceny, „mówi”, śpi w nocy, budzi się na przypomnienie, a na koniec skacze na środek
          const land = squashAfter(u, 800);
          const wake = u > 4.55 ? squashAfter(u - 4.55, 1500) : 0;
          const hopUp = ballistic(u, 4.52, 0, 600, { e: 0.001, minV: 1e9 });
          const jump = ballistic(u, J3, 0, 930, { e: 0.001, minV: 1e9 });
          const x = lerp(480, CX, prog(u, J3, D3));
          const h = u > J3 ? jump.h : hopUp.h;
          const sleep = E.io2(prog(u, 3.35, 3.6)) * (1 - E.io2(prog(u, 4.15, 4.3)));
          const mood = u < 1.88 ? "neutral" : u < 2.88 ? "happy" : u < 4.5 ? "neutral" : u < 5.8 ? "wow" : "wink";
          otto({ x, y: FLOOR, h, sq: land + wake + stretch(u > J3 ? jump.v : hopUp.v), mood, blink: Math.max(sleep * 0.92, blinkAt(u, [1.28, 2.48])), talk: u > 1.93 && u < 2.78 ? u : 0, gx: u < 2.85 ? 4 : u > 5.3 ? 5 : 0 });
        };
      });

      // ------------------------------------------------------------------
      // 4. Terminy: komendy czekają po prawej jak wysłane wiadomości, a Otto odbija je po kolei jako godziny. Bez AI.
      // Każda komenda stoi nieruchomo, zanim poleci; zamiana w wynik to przysiad i sprężyna (bez obrotu, w którym
      // pigułka znikała do zera); wyniki zostają na podłodze do końca sceny, ułożone w kolejności czasu.
      // ------------------------------------------------------------------
      const S4 = S3 + D3, J4 = 7.06, D4 = J4 + flight(830);
      scene("terminy", S4, S4 + D4, (root) => {
        root.style.background = "var(--bg)";
        const otto = makeOtto(root, 300);
        const now = el("div", "abs", root);
        now.style.cssText += `left:140px;top:300px;font:${FONT(WT.label, 34)};color:var(--ink-2)`;
        now.textContent = "Teraz: poniedziałek, 14:00";
        const cap1 = caption(root, "Komendy rozumieją terminy.", { y: 150 });
        const cap2 = caption(root, "Bez AI. Zawsze za darmo.", { y: 150 });
        const PH = 84, GAP = 14, QX = 1800, QY = 300; // pigułka, odstęp, prawa krawędź i góra kolejki
        const HEAD = FLOOR - 300 * 0.925 + (300 * 9) / 120; // czubek głowy Otta (kula ma promień 51/120 rozmiaru)
        const CH = [
          ["/przypomnij za 2 h", "dziś o 16:00", 250],
          ["/przypomnij jutro wieczorem", "jutro o 19:00", 620],
          ["/przypomnij w piątek 15:30", "w piątek o 15:30", 1310],
          ["/przypomnij 12.10 o 8", "pon 12.10 o 8:00", 1680],
        ].map(([cmd, res, slot], i) => {
          const c = el("div", "abs", root);
          c.style.cssText += `height:${PH}px;padding:0 30px;border-radius:999px;color:var(--ink);white-space:nowrap;box-shadow:0 26px 50px -34px rgb(21 21 21 / .55);transform-origin:50% 100%`;
          const look = (done) => {
            c.textContent = done ? res : cmd;
            c.style.font = FONT(done ? WT.heavy : WT.label, 38);
            c.style.lineHeight = `${PH}px`;
            c.style.background = done ? "var(--sun)" : "var(--paper)";
          };
          look(true);
          const wr = c.offsetWidth; // szerokość wyniku
          look(false);
          const w0 = c.offsetWidth; // szerokość komendy
          const toss = 2.1 + i * 0.85;
          return { c, look, done: false, slot, w0, wr, show: 0.35 + i * 0.15, toss, hit: toss + 0.45, land: toss + 1.07 };
        });
        cue(S4, "impact");
        CH.forEach((ch) => cue(S4 + ch.hit, "pop"));
        return (t) => {
          const u = t - S4;
          let sq = squashAfter(u, 930);
          let gx = 5, gy = -3, mood = "neutral";
          const fade = 1 - E.in3(prog(u, J4 - 0.1, J4 + 0.25));
          CH.forEach((ch, i) => {
            if (u > ch.hit) sq += squashAfter(u - ch.hit, 1200);
            if (u > ch.toss - 0.15 && u < ch.hit) { gx = 3; gy = -5; }
            if (u > ch.hit && u < ch.hit + 0.55) { gx = ch.slot < CX ? -5 : 5; gy = 0; mood = "happy"; }
            const done = u >= ch.hit;
            if (ch.done !== done) { ch.look(done); ch.done = done; }
            // kolejka przesuwa się w górę, gdy Otto zabierze komendę z góry
            const ahead = CH.slice(0, i).reduce((n, o) => n + E.io3(prog(u, o.toss + 0.05, o.toss + 0.45)), 0);
            const qx = QX - ch.w0 / 2, qy = QY + (i - ahead) * (PH + GAP);
            let x, y, s = 1, sx = 1, sy = 1, r = 0;
            if (u < ch.toss) {
              x = qx; y = qy;
              s = clamp(pop(u, ch.show, 2.6, 0.45), 0, 1.15);
            } else if (u < ch.hit) {
              // niski łuk: pigułka nie przelatuje przez podpis nad nią
              const p = prog(u, ch.toss, ch.hit);
              const a = arcPos(p, qx, qy, CX, HEAD - PH + 6, 90);
              x = a.x; y = a.y; r = -10 * Math.sin(Math.PI * p);
              s = 1 - 0.3 * E.in2(prog(u, ch.hit - 0.1, ch.hit));
            } else {
              const p = prog(u, ch.hit, ch.land);
              const a = arcPos(p, CX, HEAD - PH + 6, ch.slot, FLOOR - PH, 170);
              x = a.x; y = a.y;
              s = 0.7 + 0.3 * clamp(spring(u - ch.hit, 2.6, 0.45), 0, 1.25);
              if (u > ch.land) {
                const l = squashAfter(u - ch.land, 900);
                sx = 1 + l * 0.6; sy = 1 - l;
              }
            }
            T(ch.c, { x: x - (done ? ch.wr : ch.w0) / 2, y, r, s, sx, sy, o: (u < ch.show ? 0 : 1) * fade });
          });
          if (u > CH[3].land + 0.3) { gx = 0; gy = 0; mood = "happy"; }
          const hop = ballistic(u, J4, 0, 830, { e: 0.001, minV: 1e9 });
          otto({ x: lerp(CX, 400, prog(u, J4, D4)), y: FLOOR, h: hop.h, sq: sq + stretch(hop.v), mood, gx, gy, blink: blinkAt(u, [1.2, 6.4]) });
          T(now, { o: prog(u, 0.3, 0.6) * fade });
          animCap(cap1, u, 0.3, 3.4);
          animCap(cap2, u, 3.9, J4 - 0.1);
        };
      });

      // ------------------------------------------------------------------
      // 5. Lista: rzeczy wpadają na przypiętą listę, klik odhacza jedną.
      // ------------------------------------------------------------------
      const S5 = S4 + D4, J5 = 4.46, D5 = J5 + flight(1480);
      scene("lista", S5, S5 + D5 + 0.55, (root) => {
        root.style.background = "var(--bg)";
        const otto = makeOtto(root, 300);
        const card = el("div", "abs listcard", root);
        card.style.cssText += "left:1060px;top:300px;width:740px";
        card.innerHTML = `<div class="pin">Przypięta u góry czatu</div><div class="lt">📋 Twoja lista</div><ol><li><span class="n">1.</span> kupić mleko</li><li><span class="n">2.</span> odebrać paczkę</li><li><span class="n">3.</span> faktura dla Kowalskiego</li></ol><div class="kbr"><span>✓ 1</span><span class="b2">✓ 2</span><span>✓ 3</span></div>`;
        const items = [...card.querySelectorAll("li")];
        const nums = [...card.querySelectorAll(".n")];
        const b2 = card.querySelector(".b2"), kbr = card.querySelector(".kbr");
        const btns = [...kbr.querySelectorAll("span")];
        const stamp = el("img", "abs", root);
        stamp.src = "img/stamp-lista.webp";
        stamp.style.cssText += "width:170px;left:1700px;top:200px";
        const cap = caption(root, ["Jedna lista,", "przypięta u góry czatu."], { x: 120, y: 150, size: 80 });
        const tap2 = centerOf(b2);
        const touch = makeTouch(root);
        const itemH = 74;
        cue(S5, "impact"); cue(S5 + 3.0, "tap");
        return (t) => {
          const u = t - S5;
          const cardY = (1 - clamp(spring(u - 0.08, 1.2, 0.7), 0, 1.1)) * 600;
          T(card, { y: cardY, o: prog(u, 0.08, 0.23) });
          items.forEach((li, i) => {
            const ti = 0.5 + i * 0.3;
            const s = squashAfter(u - ti - 0.12, 700);
            let y = 0, o = u < ti ? 0 : 1, sc = clamp(pop(u, ti, 2.6, 0.45), 0, 1.15);
            if (i === 1) {
              const out = prog(u, 3.1, 3.45);
              sc = 1 + Math.sin(Math.PI * Math.min(out, 0.5)) * 0.08;
              o *= 1 - E.in2(out);
            }
            if (i === 2) y -= E.io3(prog(u, 3.35, 3.7)) * itemH; // wpis 3 wskakuje na miejsce 2
            T(li, { y, sx: (1 + (u > ti + 0.12 ? s : 0) * 0.6) * sc, sy: (1 - (u > ti + 0.12 ? s : 0)) * sc, o });
          });
          nums[2].textContent = u > 3.55 ? "2." : "3.";
          btns[2].textContent = u > 3.55 ? "✓ 2" : "✓ 3";
          btns[1].style.opacity = u > 3.45 ? 0 : 1;
          btns[1].style.display = u > 3.55 ? "none" : "";
          b2.classList.toggle("is-pressed", u > 2.95 && u < 3.2);
          T(kbr, { o: prog(u, 1.6, 1.9) });
          const tin = prog(u, 2.3, 2.85);
          touch(lerp(1900, tap2.x, E.out3(tin)), lerp(1080, tap2.y + cardY, E.out3(tin)), u > 2.3 && u < 3.7 ? 1 : 0, Math.sin(Math.PI * prog(u, 2.9, 3.1)));
          T(stamp, { r: -8 + Math.sin(u * 1.4) * 2, s: clamp(pop(u, 1.4, 2.4, 0.45), 0, 1.2), o: u < 1.4 ? 0 : 1 });
          animCap(cap, u, 0.45, 4.3);
          // Otto skacze wysoko na środek, a uderzenie zalewa świat żółtym (scena 6)
          const land = squashAfter(u, 830);
          const big = ballistic(u, J5, 0, 1480, { e: 0.001, minV: 1e9 });
          const pre = 0.14 * Math.sin(Math.PI * prog(u, J5 - 0.18, J5));
          otto({ x: lerp(400, CX, prog(u, J5, D5)), y: FLOOR, h: big.h, sq: land + pre + stretch(big.v), mood: u < 3.1 ? "look" : u < J5 - 0.08 ? "happy" : "wow", gx: u < 3.1 ? 5 : 0, gy: u < 3.1 ? -2 : 0, blink: blinkAt(u, [1.9, 3.95]) });
        };
      });

      // ------------------------------------------------------------------
      // 6. Kulminacja: świat robi się żółty, Otto jest kropką na końcu zdań.
      // ------------------------------------------------------------------
      const S6 = S5 + D5, D6 = 10.6;
      scene("zolty", S6, S6 + D6, (root) => {
        const wash = el("div", "fill", root);
        const otto = makeOtto(root, OS);
        const shots = [
          { t0: 0.78, t1: 3.45, lines: ["10 wiadomości AI", "na start"] },
          { t0: 3.95, t1: 6.45, lines: ["Bez maila.", "Bez rejestracji"] },
          { t0: 6.95, t1: 9.75, lines: ["Bez limitu: własny klucz", "albo abonament"] },
        ].map((sh) => {
          const size = 132;
          const rows = sh.lines.map((ln, i) => wordRow(root, ln.split(" ").map((w) => ({ text: w })), { x: 150, y: 330 + i * size * 1.12, size, weight: WT.display }));
          const last = rows[rows.length - 1];
          const endX = last.items.at(-1).x + last.items.at(-1).w;
          return { ...sh, rows, dot: { x: endX + 52, y: last.base + 6 } };
        });
        const stamp = el("img", "abs", root);
        stamp.src = "img/stamp-klucz.webp";
        stamp.style.cssText += "width:220px;left:1560px;top:150px";
        cue(S6, "boom");
        return (t) => {
          const u = t - S6;
          // iris z miejsca uderzenia, potem powrót do kremu przed sceną 7
          // krawędź koła miękka w proporcji do prędkości (references/techniques.md), żeby nie schodkowała
          const R1 = farthest(CX, FLOOR) * 1.02;
          const rIn = (v) => R1 * E.io3(prog(v, 0, 0.5));
          iris(wash, rIn(u) / R1, { cx: CX, cy: FLOOR, r1: R1, color: "var(--sun)", feather: Math.max(1, 0.6 * Math.abs(vel(rIn, u))) });
          if (u > D6 - 0.5) {
            const R2 = farthest(shots[2].dot.x, shots[2].dot.y) * 1.02;
            const rOut = (v) => R2 * (1 - E.io3(prog(v, D6 - 0.5, D6)));
            iris(wash, rOut(u) / R2, { cx: shots[2].dot.x, cy: shots[2].dot.y, r1: R2, color: "var(--sun)", feather: Math.max(1, 0.6 * Math.abs(vel(rOut, u))) });
          }
          // Otto: z podłogi na koniec pierwszego zdania, potem skok z kropki na kropkę, gdy poprzednie zdanie już wyszło
          let st = { x: CX, y: FLOOR, h: 0, s: 1, sq: squashAfter(u, 1480) };
          const toDot = (k, from, ta, tb) => {
            const p = prog(u, ta, tb);
            const a = arcPos(E.lin(p), from.x, from.y, shots[k].dot.x, shots[k].dot.y, k === 0 ? 420 : 240);
            return { x: a.x, y: a.y, h: 0, s: lerp(from.s, 0.3, E.io2(p)), sq: u > tb ? squashAfter(u - tb, 1100) : 0 };
          };
          if (u > 0.33) st = toDot(0, { x: CX, y: FLOOR, s: 1 }, 0.33, 0.76);
          if (u > 3.6) st = toDot(1, { ...shots[0].dot, s: 0.3 }, 3.6, 4.4);
          if (u > 6.6) st = toDot(2, { ...shots[1].dot, s: 0.3 }, 6.6, 7.4);
          otto({ ...st, mood: u < 0.78 ? "wow" : u < 7.45 ? "happy" : "wink", shadow: 0, blink: blinkAt(u, [1.95, 5.2, 8.6]) });
          for (const sh of shots) sh.rows.forEach((row, i) => animRow(row, u, sh.t0 + i * 0.18, sh.t1, { st: 0.06 }));
          T(stamp, { r: 8 + Math.sin(u * 1.3) * 2.5, s: clamp(pop(u, 7.45, 2.4, 0.45), 0, 1.2) * (1 - E.in3(prog(u, 9.45, 9.75))), o: u > 7.45 && u < 9.75 ? 1 : 0 });
        };
      });

      // ------------------------------------------------------------------
      // 7. Paragon: cała karta Otta o Tobie. Treść zostaje w Telegramie.
      // ------------------------------------------------------------------
      const S7 = S6 + D6, J7 = 4.55, D7 = J7 + flight(900);
      scene("paragon", S7, S7 + D7, (root) => {
        root.style.background = "var(--bg)";
        const otto = makeOtto(root, 240);
        const paper = el("div", "abs receipt", root);
        paper.style.cssText += "left:240px;top:170px;width:780px";
        paper.innerHTML = `<div class="rh"><b>Karta Otta o Tobie</b><span>Przykład, w całości</span></div>
          <dl><div><dt>Czat</dt><dd>nr 58•••••21</dd></div><div><dt>Strefa czasowa</dt><dd>Europe/Warsaw</dd></div><div><dt>Darmowe wiadomości AI</dt><dd>7 z 10</dd></div><div><dt>Przypomnienie</dt><dd>wiadomość nr 128, jutro 9:00</dd></div></dl>
          <p class="rf">To wszystko. Treści tu nie ma.</p>`;
        const rows = [...paper.querySelectorAll("dl div"), paper.querySelector(".rf")];
        const stamp = el("img", "abs", root);
        stamp.src = "img/stamp-klodka.webp";
        stamp.style.cssText += "width:170px;left:930px;top:110px";
        const cap = caption(root, ["Treść zostaje", "w Telegramie."], { x: 1120, y: 300, size: 100 });
        cue(S7, "whoosh");
        return (t) => {
          const u = t - S7;
          // drukowanie: papier wysuwa się z góry, wiersze po kolei; cała karta stoi potem ok. 2,5 s
          const print = E.out3(prog(u, 0.15, 1.0));
          paper.style.clipPath = `inset(0 0 ${(1 - print) * 100}% 0)`;
          const off = E.in2(prog(u, J7 - 0.35, J7 + 0.45)) * 1100;
          T(paper, { y: off, r: off * 0.004 });
          rows.forEach((r, i) => (r.style.opacity = clamp((u - (0.55 + i * 0.25)) / 0.2)));
          T(stamp, { y: off, r: 9 + Math.sin(u * 1.5) * 2, s: clamp(pop(u, 1.6, 2.4, 0.45), 0, 1.2), o: u > 1.6 ? 1 : 0 });
          animCap(cap, u, 1.0, J7 - 0.35);
          const drop = ballistic(u, -0.1, 560, 0, { e: 0.36, minV: 240 });
          const hop = ballistic(u, J7, 0, 900, { e: 0.001, minV: 1e9 });
          const h = u > J7 ? hop.h : drop.h;
          otto({ x: lerp(1260, CX, prog(u, J7, D7)), y: 1010 - 140, h, sq: (u > J7 ? stretch(hop.v) : squashAfter(drop.since, drop.iv) + stretch(drop.v)), mood: u < 2.2 ? "look" : "wink", gx: u < 2.2 ? -5 : 0, blink: blinkAt(u, [1.2, 3.3]) });
        };
      });

      // ------------------------------------------------------------------
      // 8. Plansza końcowa: Otto ląduje jak na początku, dwa „O” z napisu stają się jego oczami.
      // Stoi do końca filmu (TIMELINE), tekst co najmniej 3,5 s.
      // ------------------------------------------------------------------
      const S8 = S7 + D7;
      if (TIMELINE - S8 < 5.9) console.error(`Plansza końcowa trwa ${(TIMELINE - S8).toFixed(2)} s: wydłuż TIMELINE.`);
      scene("koniec", S8, TIMELINE + 1, (root) => {
        root.style.background = "var(--bg)";
        const OY = 470, OSZ = 300;
        const otto = makeOtto(root, OSZ);
        const FS = 190;
        const font = FONT(WT.display, FS);
        const m = measure(NAME, font, "-0.04em");
        const wx = CX - m.w / 2, wy = 520;
        const word = el("div", "abs", root);
        const ls = letters(word, NAME, font, "-0.04em");
        // kopie liter „O”: odrywają się i lecą do Otta, gdzie stają się oczami
        const svg = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: "abs" }, root);
        const oIdx = [...NAME].map((c, i) => (c.toLowerCase() === "o" ? i : -1)).filter((i) => i >= 0).slice(0, 2);
        const rings = oIdx.map(() => svgEl("rect", { fill: "none" }, svg));
        const handle = el("div", "abs", root);
        handle.style.cssText += `left:0;width:${W}px;top:${wy + FS * 1.18}px;text-align:center;font:${FONT(WT.display, 56)};color:var(--ink)`;
        handle.textContent = "@HiOttoBot w Telegramie";
        const site = el("div", "abs", root);
        site.style.cssText += `left:0;width:${W}px;top:${wy + FS * 1.18 + 84}px;text-align:center;font:${FONT(WT.label, 40)};color:var(--ink-2)`;
        site.textContent = "otto.designhouse.me";
        const free = el("div", "abs", root);
        free.style.cssText += `left:0;width:${W}px;top:${wy + FS * 1.18 + 146}px;text-align:center;font:${FONT(WT.label, 34)};color:var(--ink-2)`;
        free.textContent = "Zawsze za darmo. Kod na GitHubie.";
        const dh = el("img", "abs", root);
        dh.src = "img/design-house.svg";
        dh.style.cssText += `height:34px;left:${CX - 136}px;top:${H - 86}px`;
        cue(S8 + 0.45, "impact"); cue(S8 + 1.2, "rise"); cue(S8 + 2.1, "pop");
        return (t) => {
          const u = t - S8;
          const d = ballistic(u, -0.22, 430, 0, { e: 0.36, minV: 240 });
          const morph = E.io3(prog(u, 1.25, 2.05));
          const eyesOn = u > 2.05;
          otto({ x: CX, y: OY, h: d.h, sq: squashAfter(d.since, d.iv) + stretch(d.v) + (eyesOn ? squashAfter(u - 2.05, 900) : 0), mood: u < 3.4 ? "neutral" : "wink", eyes: eyesOn ? 1 : 0, blink: blinkAt(u, [2.7, 5.1]), s: 1 });
          // napis: litery wpadają po kolei
          ls.forEach((L, i) => {
            const p = E.outExpo(prog(u, 0.55 + i * 0.06, 1.2 + i * 0.06));
            T(L.e, { x: wx + L.x, y: wy + (1 - p) * 90, o: p });
          });
          // pierścienie liter „O” → białe kapsuły oczu
          const eyes = otto.eyeRects(CX, OY);
          rings.forEach((r, k) => {
            const L = ls[oIdx[k]];
            const upper = NAME[oIdx[k]] === "O";
            // kształt litery: wielkie „O” ma wysokość wersalików, małe „o” wysokość x; grubość kreski jak w kroju 800
            const sw0 = FS * (upper ? 0.135 : 0.12);
            const gw = L.w * (upper ? 0.84 : 0.8) - sw0, gh = FS * (upper ? 0.7 : 0.52) - sw0;
            const ox = wx + L.x + L.w / 2, oy = wy + FS * 0.94 - (upper ? 0.35 : 0.26) * FS;
            const e = eyes[k];
            const w = lerp(gw, e.w, morph), h = lerp(gh, e.h, morph);
            const cx = lerp(ox, e.x + e.w / 2, morph), cy = lerp(oy, e.y + e.h / 2, morph) - Math.sin(Math.PI * morph) * 120;
            const sw = lerp(sw0, 0, E.in2(morph));
            r.setAttribute("x", (cx - w / 2).toFixed(1));
            r.setAttribute("y", (cy - h / 2).toFixed(1));
            r.setAttribute("width", w.toFixed(1));
            r.setAttribute("height", h.toFixed(1));
            r.setAttribute("rx", lerp(w / 2, e.r, morph).toFixed(1));
            r.setAttribute("ry", lerp(h / 2, e.r, morph).toFixed(1));
            r.setAttribute("stroke", morph < 0.4 ? css("--ink") : "#fff");
            r.setAttribute("stroke-width", sw.toFixed(1));
            r.setAttribute("fill", morph > 0.4 ? "#fff" : "none");
            r.style.opacity = u > 1.2 && !eyesOn ? 1 : 0;
            // litera w napisie: oddaje się na oczy i po chwili odrasta
            const back = 2.2 + k * 0.08;
            if (u > 1.2 && u < back) L.e.style.opacity = 0;
            else if (u >= back) {
              L.e.style.opacity = 1;
              L.e.style.transform += ` scale(${clamp(pop(u, back, 2.6, 0.45), 0, 1.15)})`;
            }
          });
          T(handle, { y: (1 - E.outExpo(prog(u, 2.15, 2.75))) * 30, o: prog(u, 2.15, 2.4) });
          T(site, { y: (1 - E.outExpo(prog(u, 2.35, 2.95))) * 30, o: prog(u, 2.35, 2.6) });
          T(free, { y: (1 - E.outExpo(prog(u, 2.55, 3.15))) * 30, o: prog(u, 2.55, 2.8) });
          T(dh, { o: prog(u, 2.75, 3.1) });
        };
      });

      // ------------------------------------------------------------------
      // Grain + vignette (the grain changes 24 times per second of output time)
      // ------------------------------------------------------------------
      let grain;
      function makeGrain() {
        grain = el("canvas", null, stage);
        grain.id = "grain";
        // square grain pixels in every format: the canvas has the proportions of the frame plus the jitter margin
        const px = Math.max(2, Math.round(Math.min(W, H) / 400));
        const gw = Math.ceil((W + 128) / px), gh = Math.ceil((H + 128) / px);
        grain.width = gw;
        grain.height = gh;
        const g = grain.getContext("2d");
        const img = g.createImageData(gw, gh);
        for (let i = 0; i < gw * gh; i++) {
          const v = hash(i * 1.37) * 255;
          img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
          img.data[i * 4 + 3] = 255;
        }
        g.putImageData(img, 0, 0);
        grain.style.cssText = `width:${gw * px}px;height:${gh * px}px;image-rendering:pixelated`;
        el("div", null, stage).id = "vignette";
      }

      // ------------------------------------------------------------------
      // Render and readiness
      // ------------------------------------------------------------------
      function render(time) {
        const t = time * SPEED;
        for (const s of scenes) {
          const on = t >= s.t0 && t < s.t1;
          s.root.style.display = on ? "block" : "none";
          if (on) s.update(t);
        }
        const gf = Math.floor(time * 24);
        grain.style.transform = `translate(${-hash(gf) * 64}px,${-hash(gf + 99) * 64}px)`;
      }

      window.__DURATION = DURATION;
      window.__SUB = SUB;
      window.__SIZE = { w: W, h: H };
      window.__render = render;
      // Scenes are built only after the font has loaded, because they measure letters.
      window.__ready = (async () => {
        // Every face declared in @font-face (all weights, styles and subsets), not a guessed list of weights:
        // a Black or an italic that never loaded renders in a fallback font without a warning.
        const declared = [...document.fonts];
        await Promise.all(declared.map((f) => f.load().catch(() => {})));
        await document.fonts.ready;
        for (const f of declared.filter((f) => f.status !== "loaded"))
          console.error(`Font "${f.family}" ${f.weight} ${f.style} did not load: text in it will render in a fallback font. Check @font-face and the files in fonts/.`);
        if (!declared.some((f) => f.family.replace(/["']/g, "") === FAMILY))
          console.error(`No @font-face for "${FAMILY}" (FAMILY): the film will render in a fallback font.`);
        for (const d of defs) {
          const root = el("div", "scene", stage);
          root.id = d.name;
          building = d.shift;
          root.style.display = "block"; // laid out but invisible while building: with display: none every measurement is 0
          root.style.visibility = "hidden";
          const update = d.build(root);
          root.style.display = "none";
          root.style.visibility = "";
          scenes.push({ ...d, root, update: (t) => update(t + d.shift) });
        }
        building = 0;
        const num = (v) => (v === "normal" ? 400 : v === "bold" ? 700 : Number(v));
        const covers = (range, w) => { const [a, b = a] = String(range).split(" ").map(num); return w >= a && w <= b; };
        for (const key of requested) {
          const [w, st] = key.split(" ");
          if (!declared.some((f) => f.family.replace(/["']/g, "") === FAMILY && f.style === st && covers(f.weight, Number(w))))
            console.error(`"${FAMILY}" ${w}${st === "normal" ? "" : " " + st} has no @font-face: the browser fakes it or uses another face. Declare it or use a weight from WT.`);
        }
        makeGrain();
        window.__CUES = CUES.map((c) => ({ ...c, t: c.t / SPEED, ...(c.d ? { d: c.d / SPEED } : {}) }));
        // decode() can hang under load, so each image gets at most 8 s.
        await Promise.all([...document.images].map((i) => Promise.race([i.decode().catch(() => {}), new Promise((r) => setTimeout(r, 8000))])));
        if (!CAPTURE) live();
      })();

      // Live preview in the browser
      function live() {
        const hud = document.getElementById("hud");
        const bar = hud.querySelector("i");
        const label = hud.querySelector("span");
        const fit = () => (stage.style.transform = `scale(${Math.min(innerWidth / W, (innerHeight - 26) / H)})`);
        fit();
        addEventListener("resize", fit);
        let t = Q.has("t") ? Number(Q.get("t")) : 0;
        let playing = !Q.has("t");
        let last = performance.now();
        addEventListener("keydown", (e) => {
          if (e.code === "Space") playing = !playing;
          if (e.code === "ArrowRight") t = Math.min(DURATION, t + 1);
          if (e.code === "ArrowLeft") t = Math.max(0, t - 1);
        });
        hud.addEventListener("click", (e) => (t = (e.clientX / innerWidth) * DURATION));
        const loop = (now) => {
          if (playing) t = (t + (now - last) / 1000) % DURATION;
          last = now;
          render(t);
          bar.style.width = `${(t / DURATION) * 100}%`;
          label.textContent = `${t.toFixed(2)} s`;
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
    </script>
  </body>
</html>
